# sherpa-onnx ships shared libs next to the binary (target/<profile>/):
# let the executable find them without LD_LIBRARY_PATH.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]

# macOS: the sherpa-onnx / onnxruntime dylibs sit next to the executable
# (Contents/MacOS inside the .app).
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,@executable_path"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,@executable_path"]
