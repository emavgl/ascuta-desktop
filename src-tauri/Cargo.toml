[package]
name = "ascuta-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ascuta-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ksni = { version = "0.3", features = ["blocking"] }
global-hotkey = "0.7"
winit = "0.30"
enigo = { version = "0.6", features = ["x11rb"] }
arboard = "3"
# Phone bridge: tiny blocking HTTP server (no async runtime in core) + QR
# pairing payload rendered to the terminal. getrandom for the pairing token.
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false }
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
