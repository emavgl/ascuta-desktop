[package]
name = "ascuta-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ascuta-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
global-hotkey = "0.7"
winit = "0.30"
# CPU pixel buffer for the HUD pill (no GPU/GL context needed).
softbuffer = "0.4"
# Text for the bar labels ("Transcribing…", "Cleaning up…").
ab_glyph = "0.2"
enigo = { version = "0.6", features = ["x11rb"] }
arboard = "3"
# Phone bridge: tiny blocking HTTP server (no async runtime in core) + QR
# pairing payload rendered to the terminal. getrandom for the pairing token.
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false }
getrandom = "0.3"

# Model download + extraction (pure Rust, rustls — no system OpenSSL).
ureq = { version = "2", default-features = false }
bzip2 = "0.6"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
# Native backends are opt-in so the default build/test stays headless
# (no ALSA headers, no prebuilt sherpa-onnx download).
cpal = { version = "0.15", optional = true }
eframe = { version = "0.36", optional = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
sherpa-rs = { version = "0.6.8", optional = true, default-features = false, features = ["download-binaries"] }

# Raw key events for modifier-only / chord hotkeys (Whisper-Flow style):
# evdev on Linux (needs the `input` group; also works on Wayland), rdev on
# macOS/Windows.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
evdev = "0.13"
libc = "0.2"
# Native Wayland layer-shell surface for the Flow bar (crisp at any scale).
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
# Wayland text injection: XDG RemoteDesktop portal (keyboard keysyms).
ashpd = { version = "0.13", features = ["remote_desktop", "screencast"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
# AT-SPI: is a text field focused? (decides paste vs clipboard-only)
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rdev = "0.5"
# System tray on macOS/Windows (Linux uses StatusNotifier via ksni).
tray-icon = "0.26"

[features]
default = ["native-ui", "tls"]
# rustls (ring needs a C toolchain; the feature lets cross-`cargo check` skip it).
tls = ["ureq/tls"]
native-ui = ["dep:eframe"]
capture = ["dep:cpal"]
sherpa = ["dep:sherpa-rs"]

[dev-dependencies]
tempfile = "3"
