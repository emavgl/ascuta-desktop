name: release

# Builds Linux, macOS and Windows packages when a `v*` tag is pushed and
# attaches them (with checksums) to the GitHub release.
#
#   git tag v0.2.2 && git push origin v0.2.2

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (ALSA + XKB + Wayland headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Remove stale sherpa libraries from the restored cache
        # sherpa-rs-sys skips the copy when the destination exists. A dangling
        # symlink restored from the target cache makes `exists()` false, the
        # hard link fail with EEXIST and the copy follow the dead link.
        run: |
          if [ -d target ]; then
            # Drop the copied libraries and the build-script fingerprint, so
            # sherpa-rs-sys runs again and re-copies them into the profile and
            # deps directories. Keeping the fingerprint would leave cargo
            # linking against libraries that no longer exist.
            find target -maxdepth 3 \( -name 'libonnxruntime.*' -o -name 'libsherpa-onnx-*' \) -exec rm -f {} +
            rm -rf target/*/build/sherpa-rs-* target/*/.fingerprint/sherpa-rs-*
          fi
          mkdir -p target/debug/deps target/release/deps

      - name: Gate (fmt + clippy + test)
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

      - name: Build and package
        run: packaging/build-release.sh "${GITHUB_REF_NAME:-dev}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/ascuta-desktop-*.tar.gz*
            dist/install.sh

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple silicon
          - os: macos-15-intel  # Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Remove stale sherpa libraries from the restored cache
        run: |
          if [ -d target ]; then
            # Drop the copied libraries and the build-script fingerprint, so
            # sherpa-rs-sys runs again and re-copies them into the profile and
            # deps directories. Keeping the fingerprint would leave cargo
            # linking against libraries that no longer exist.
            find target -maxdepth 3 \( -name 'libonnxruntime.*' -o -name 'libsherpa-onnx-*' \) -exec rm -f {} +
            rm -rf target/*/build/sherpa-rs-* target/*/.fingerprint/sherpa-rs-*
          fi
          mkdir -p target/debug/deps target/release/deps

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build .app and .dmg
        run: packaging/macos/build-app.sh "${GITHUB_REF_NAME:-dev}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.os }}
          path: dist/Ascuta-*.dmg*

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Remove stale sherpa libraries from the restored cache
        shell: pwsh
        run: |
          # Drop the copied DLLs and the build-script fingerprint, so
          # sherpa-rs-sys runs again and re-copies them; otherwise cargo links
          # against libraries that no longer exist.
          Get-ChildItem target -Recurse -Depth 3 -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(onnxruntime.*|sherpa-onnx-.*|cargs)\.dll$' } |
            Remove-Item -Force
          Remove-Item -Recurse -Force target\*\build\sherpa-rs-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force target\*\.fingerprint\sherpa-rs-* -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force target\release\deps | Out-Null

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build zip
        shell: pwsh
        run: packaging/windows/build-zip.ps1 "${env:GITHUB_REF_NAME}"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build setup exe
        shell: pwsh
        run: packaging/windows/build-installer.ps1 "${env:GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/ascuta-desktop-*.zip*
            dist/ascuta-desktop-*-setup.exe*
            dist/install-windows.ps1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86_64, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
