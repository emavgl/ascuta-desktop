name: release

# Builds Linux, macOS and Windows packages when a `v*` tag is pushed and
# attaches them (with checksums) to the GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: System libraries (ALSA headers for the microphone)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build and package
        run: packaging/build-release.sh "${GITHUB_REF_NAME:-dev}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/ascuta-desktop-*.tar.gz*
            dist/install.sh

  macos:
    strategy:
      matrix:
        include:
          - os: macos-14   # Apple silicon
          - os: macos-13   # Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Build .app and .dmg
        run: packaging/macos/build-app.sh "${GITHUB_REF_NAME:-dev}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.os }}
          path: dist/Ascuta-*.dmg*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Build zip
        shell: pwsh
        run: packaging/windows/build-zip.ps1 "${env:GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ascuta-desktop-*.zip*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86_64, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
